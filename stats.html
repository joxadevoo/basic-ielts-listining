<!DOCTYPE html>
<html lang="uz" data-theme="light">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>FluentEar — Foydalanish Statistikasi</title>
  <link rel="icon" type="image/svg+xml" href="./favicon.svg">
  <link href="https://fonts.googleapis.com/css2?family=Outfit:wght@300;400;500;600;700;800;900&display=swap" rel="stylesheet">
  <style>
    :root {
      --bg: #f3f4f6;
      --bg-surface: #ffffff;
      --text: #111827;
      --text-muted: #6b7280;
      --border: rgba(0, 0, 0, 0.08);
      --accent: hsl(250, 85%, 60%);
      --radius-md: 14px;
      --radius-sm: 8px;
      --font: 'Outfit', sans-serif;
      
      --color-emerald: hsl(150, 80%, 40%);
      --color-purple: hsl(260, 85%, 55%);
      --color-cyan: hsl(190, 90%, 45%);

      --gradient-emerald: linear-gradient(90deg, hsl(150, 80%, 40%), hsl(170, 75%, 45%));
      --gradient-purple: linear-gradient(90deg, hsl(260, 85%, 55%), hsl(280, 80%, 50%));
      --gradient-cyan: linear-gradient(90deg, hsl(190, 90%, 45%), hsl(210, 85%, 45%));
    }

    [data-theme="dark"] {
      --bg: #030712;
      --bg-surface: rgba(255, 255, 255, 0.03);
      --text: #f3f4f6;
      --text-muted: #9ca3af;
      --border: rgba(255, 255, 255, 0.08);
      --accent: hsl(250, 90%, 65%);
    }

    * {
      margin: 0;
      padding: 0;
      box-sizing: border-box;
    }

    body {
      font-family: var(--font);
      background: var(--bg);
      color: var(--text);
      min-height: 100vh;
      line-height: 1.5;
      position: relative;
      display: flex;
      flex-direction: column;
    }

    /* Grid overlay for a premium tech feel */
    body::before {
      content: '';
      position: absolute;
      inset: 0;
      background-image: radial-gradient(rgba(0, 0, 0, 0.03) 1px, transparent 1px);
      background-size: 24px 24px;
      pointer-events: none;
      z-index: 0;
    }

    [data-theme="dark"] body::before {
      background-image: radial-gradient(rgba(255, 255, 255, 0.02) 1px, transparent 1px);
    }

    /* Decorative background mesh glows (light mode subtle) */
    .bg-glow-1 {
      position: absolute;
      top: -10%;
      left: -10%;
      width: 50vw;
      height: 50vw;
      border-radius: 50%;
      background: radial-gradient(circle, rgba(99, 102, 241, 0.05) 0%, transparent 70%);
      pointer-events: none;
      z-index: 0;
    }

    /* Header */
    .stats-header {
      padding: 16px 24px;
      display: flex;
      align-items: center;
      justify-content: space-between;
      border-bottom: 1px solid var(--border);
      backdrop-filter: blur(24px);
      -webkit-backdrop-filter: blur(24px);
      position: sticky;
      top: 0;
      z-index: 10;
      background: color-mix(in srgb, var(--bg) 85%, transparent);
    }

    .stats-header-left {
      display: flex;
      align-items: center;
      gap: 12px;
    }

    .back-btn {
      display: inline-flex;
      align-items: center;
      gap: 6px;
      padding: 6px 12px;
      border-radius: var(--radius-sm);
      border: 1px solid var(--border);
      background: var(--bg-surface);
      color: var(--text);
      font-family: var(--font);
      font-size: 0.85rem;
      font-weight: 600;
      cursor: pointer;
      text-decoration: none;
      transition: all 0.2s ease;
    }

    .back-btn:hover {
      background: rgba(0, 0, 0, 0.03);
      border-color: var(--accent);
    }

    [data-theme="dark"] .back-btn:hover {
      background: rgba(255, 255, 255, 0.05);
    }

    .stats-title {
      font-size: 1.15rem;
      font-weight: 800;
      letter-spacing: -0.5px;
    }

    .stats-title span {
      background: linear-gradient(135deg, hsl(250, 85%, 60%), hsl(280, 80%, 50%));
      -webkit-background-clip: text;
      -webkit-text-fill-color: transparent;
      background-clip: text;
    }

    .logo-icon-small {
      background: linear-gradient(135deg, hsl(250, 85%, 60%), hsl(280, 80%, 50%));
      width: 26px;
      height: 26px;
      border-radius: 8px;
      display: flex;
      align-items: center;
      justify-content: center;
      color: #fff;
      flex-shrink: 0;
    }

    .logo-icon-small svg {
      width: 15px;
      height: 15px;
    }

    /* Main Content Layout - Mobile Optimized */
    .dashboard-container {
      max-width: 600px;
      width: 100%;
      margin: 0 auto;
      padding: 32px 16px;
      position: relative;
      z-index: 1;
      flex: 1;
      display: flex;
      flex-direction: column;
      justify-content: center;
    }

    /* Glass Cards - Flat Design, NO hover scale / NO shadows */
    .glass-card {
      background: var(--bg-surface);
      border: 1px solid var(--border);
      border-radius: var(--radius-md);
      padding: 24px;
      width: 100%;
    }

    /* Chart Title Header */
    .chart-title-area {
      display: flex;
      flex-direction: column;
      gap: 8px;
      margin-bottom: 24px;
      padding-bottom: 16px;
      border-bottom: 1px solid var(--border);
    }

    .chart-title {
      font-size: 1rem;
      font-weight: 700;
      display: flex;
      align-items: center;
      gap: 8px;
    }

    .chart-title svg {
      width: 18px;
      height: 18px;
      fill: none;
      stroke: var(--accent);
      stroke-width: 2;
    }

    /* 3 Horizontal Progress Linears - Mobile Responsive */
    .activity-bars {
      display: flex;
      flex-direction: column;
      gap: 24px;
    }

    .activity-bar-row {
      display: flex;
      flex-direction: column;
      gap: 8px;
    }

    .activity-meta {
      display: flex;
      align-items: center;
      justify-content: space-between;
    }

    .activity-info {
      display: flex;
      align-items: center;
      gap: 6px;
      font-weight: 600;
      font-size: 0.88rem;
    }

    .activity-info svg {
      width: 16px;
      height: 16px;
      fill: none;
      stroke: currentColor;
      stroke-width: 2;
    }

    .activity-count {
      font-size: 1rem;
      font-weight: 800;
      display: flex;
      align-items: baseline;
      gap: 2px;
    }

    .activity-count span.lbl {
      font-size: 0.72rem;
      font-weight: 600;
      color: var(--text-muted);
    }

    .activity-track {
      height: 10px;
      background: rgba(0, 0, 0, 0.04);
      border: 1px solid var(--border);
      border-radius: 6px;
      overflow: hidden;
      position: relative;
    }

    [data-theme="dark"] .activity-track {
      background: rgba(255, 255, 255, 0.03);
    }

    .activity-fill {
      height: 100%;
      border-radius: 6px;
      width: 0;
      transition: width 1.2s cubic-bezier(0.25, 1, 0.5, 1);
    }

    /* Loading Area */
    .stats-loading {
      display: flex;
      flex-direction: column;
      align-items: center;
      justify-content: center;
      padding: 60px 20px;
      gap: 16px;
      width: 100%;
    }

    .spinner {
      width: 36px;
      height: 36px;
      border: 3px solid var(--border);
      border-top-color: var(--accent);
      border-radius: 50%;
      animation: spin 0.8s cubic-bezier(0.5, 0.1, 0.1, 0.9) infinite;
    }

    @keyframes spin { 
      to { transform: rotate(360deg); } 
    }

    .loading-text {
      font-size: 0.85rem;
      font-weight: 500;
      color: var(--text-muted);
    }

    /* Footer */
    .stats-footer {
      text-align: center;
      padding: 20px;
      font-size: 0.75rem;
      color: var(--text-muted);
      border-top: 1px solid var(--border);
      background: rgba(0, 0, 0, 0.02);
      margin-top: auto;
    }

    .stats-footer a {
      color: var(--text);
      font-weight: 600;
      text-decoration: none;
    }

    /* Mobile view optimizations */
    @media (max-width: 480px) {
      .stats-header {
        padding: 12px 16px;
      }
      .dashboard-container {
        padding: 20px 12px;
      }
      .glass-card {
        padding: 20px 16px;
      }
    }
  </style>
</head>
<body>

  <div class="bg-glow-1"></div>

  <header class="stats-header">
    <div class="stats-header-left">
      <a href="/" class="back-btn">
        <svg width="14" height="14" fill="none" stroke="currentColor" stroke-width="2.5" viewBox="0 0 24 24"><path d="M19 12H5M12 19l-7-7 7-7"/></svg>
        Orqaga
      </a>
      <div style="display: flex; align-items: center; gap: 8px;">
        <div class="logo-icon-small">
          <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.5" stroke-linecap="round" stroke-linejoin="round">
            <path d="M12 2C6.48 2 2 6.48 2 12c0 4 2.5 7.5 6 9" />
            <path d="M22 12c0-5.52-4.48-10-10-10" />
            <path d="M7 8h5" />
            <path d="M7 12h10" />
            <path d="M7 8v8" />
            <path d="M13 8h5" />
            <path d="M13 8v8h6" />
          </svg>
        </div>
        <div class="stats-title"><span>FluentEar</span> Statistika</div>
      </div>
    </div>
  </header>

  <main class="dashboard-container" id="dashboard-container">
    <div class="stats-loading" id="stats-loading">
      <div class="spinner"></div>
      <div class="loading-text">Jonli ma'lumotlar yuklanmoqda...</div>
    </div>
  </main>

  <footer class="stats-footer">
    <a href="/">Jaxongir Toshpo'latov</a> tomonidan yaratilgan — FluentEar &copy; 2025
  </footer>

  <script>
    // Detect and apply theme (defaults to light as requested)
    const savedTheme = localStorage.getItem('ielts_theme') || 'light';
    document.documentElement.setAttribute('data-theme', savedTheme);

    async function loadStats() {
      const container = document.getElementById('dashboard-container');
      const loading = document.getElementById('stats-loading');

      // Smart Fallback to Vercel production API when on localhost
      let endpoint = '/api/stats';
      if (window.location.hostname === 'localhost' || window.location.hostname === '127.0.0.1') {
        endpoint = 'https://fluentear.vercel.app/api/stats';
      }

      try {
        const res = await fetch(endpoint);
        if (!res.ok) throw new Error(`HTTP ${res.status}`);
        const data = await res.json();
        if (!data) throw new Error('Empty response');

        loading.remove();
        const isEmpty = data.totalUnique === 0 && data.totalVisits === 0;
        renderStats(container, data, isEmpty);
      } catch (err) {
        console.warn('Failed to fetch stats:', err);
        loading.innerHTML = `
          <div class="spinner" style="border-top-color: hsl(340, 85%, 60%)"></div>
          <div class="loading-text" style="color: hsl(340, 85%, 60%)">Statistikani yuklab bo'lmadi</div>
          <div style="font-size:0.8rem; color:var(--text-muted); text-align:center; max-width:420px; line-height:1.6; margin-top:10px;">
            Server bilan bog'lanishda xatolik. Sahifani yangilab ko'ring.
          </div>
        `;
      }
    }

    function renderStats(container, data, isEmpty = false) {
      const { dailyActive = 0, weeklyActive = 0, monthlyActive = 0 } = data;
      const emptyBanner = isEmpty ? `
        <div style="margin-bottom:16px;padding:14px 16px;border-radius:12px;background:hsla(340,85%,60%,0.12);color:var(--text-muted);font-size:0.85rem;line-height:1.6;text-align:center;max-width:520px;margin-left:auto;margin-right:auto;">
          Hozircha statistika <b>0</b>. Ilovaga kirishlar yozilmayapti — odatda Blob token eski yoki Telegram bot guruhda <b>admin + pin</b> huquqiga ega emas.
        </div>
      ` : '';

      // 1. Render progress bars directly inside the glass-card
      container.innerHTML = `
        ${emptyBanner}
        <div class="glass-card">
          <div class="chart-title-area">
            <div class="chart-title">
              <svg viewBox="0 0 24 24"><path d="M12 20V10M18 20V4M6 20v-4"/></svg>
              Foydalanuvchilar faolligi
            </div>
          </div>
          <div class="activity-bars">
            <!-- Monthly -->
            <div class="activity-bar-row">
              <div class="activity-meta">
                <span class="activity-info" style="color: var(--color-emerald)">
                  <svg viewBox="0 0 24 24"><rect x="3" y="4" width="18" height="18" rx="2" ry="2"/><path d="M16 2v4M8 2v4M3 10h18M8 14h8m-8 4h6"/></svg>
                  Oylik faol (MAU)
                </span>
                <span class="activity-count">${monthlyActive} <span class="lbl">ta user</span></span>
              </div>
              <div class="activity-track">
                <div class="activity-fill" style="width: 0%; background: var(--gradient-emerald)" data-target="100"></div>
              </div>
            </div>

            <!-- Weekly -->
            <div class="activity-bar-row">
              <div class="activity-meta">
                <span class="activity-info" style="color: var(--color-purple)">
                  <svg viewBox="0 0 24 24"><rect x="3" y="4" width="18" height="18" rx="2" ry="2"/><path d="M16 2v4M8 2v4M3 10h18M8 14h8"/></svg>
                  Haftalik faol (WAU)
                </span>
                <span class="activity-count">${weeklyActive} <span class="lbl">ta user</span></span>
              </div>
              <div class="activity-track">
                <div class="activity-fill" style="width: 0%; background: var(--gradient-purple)" data-target="${(weeklyActive / (monthlyActive || 1)) * 100}"></div>
              </div>
            </div>

            <!-- Daily -->
            <div class="activity-bar-row">
              <div class="activity-meta">
                <span class="activity-info" style="color: var(--color-cyan)">
                  <svg viewBox="0 0 24 24"><circle cx="12" cy="12" r="10"/><path d="M12 6v6l4 2"/></svg>
                  Bugun (DAU)
                </span>
                <span class="activity-count">${dailyActive} <span class="lbl">ta user</span></span>
              </div>
              <div class="activity-track">
                <div class="activity-fill" style="width: 0%; background: var(--gradient-cyan)" data-target="${(dailyActive / (monthlyActive || 1)) * 100}"></div>
              </div>
            </div>
          </div>
        </div>
      `;

      // Trigger animations
      requestAnimationFrame(() => {
        setTimeout(() => {
          container.querySelectorAll('.activity-fill').forEach(bar => {
            bar.style.width = bar.dataset.target + '%';
          });
        }, 150);
      });
    }

    loadStats();
  </script>
</body>
</html>
